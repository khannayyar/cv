name: Deploy academic CV to GitHub Pages

on:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          # A Scholar refresh may have committed after the calling run started.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v6
      - name: Package public website files
        run: python scripts/build_site.py
      # Keep the Pages tar format without the upload wrapper's Node.js 20 dependency.
      - name: Archive GitHub Pages site
        run: |
          tar --dereference --hard-dereference --directory dist \
            --exclude=.git --exclude=.github --exclude='.[^/]*' \
            -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
