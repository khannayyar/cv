name: Update Research Publications

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        
    - name: Update research data
      env:
        SCHOLAR_ID: ${{ secrets.SCHOLAR_ID }}
        PAGE_SIZE: '100'
        MAX_PUBS: '300'
        FETCH_DETAILS: 'false'
      run: |
        python scripts/update_research.py
        
    - name: Commit and push if changed
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git add data/research.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update research publications [skip ci]" && git push)
